# ==============================================
# Observability Stack - Development Override
# ==============================================
# Use this file when developing with observability stack
# Command: docker compose -f docker-compose.yml -f docker-compose.observability.yml -f docker-compose.override.yml -f docker-compose.override.observability.yml up -d
# ==============================================

services:

  # ==============================================
  # OpenTelemetry Collector - Dev Overrides
  # ==============================================
  otel-collector:
    ports:
      - "1888:1888"   # pprof
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter
      - "13133:13133" # health_check
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # ==============================================
  # Prometheus - Dev Overrides
  # ==============================================
  prometheus:
    ports:
      - "9090:9090"  # Exposed to host

  # ==============================================
  # Grafana - Dev Overrides
  # ==============================================
  grafana:
    ports:
      - "3000:3000"  # Exposed to host
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor,traceQLStreaming"
      GF_LOG_LEVEL: "debug"

  # ==============================================
  # Tempo - Dev Overrides
  # ==============================================
  tempo:
    ports:
      - "3200:3200"  # Tempo HTTP
      - "9095:9095"  # Tempo gRPC

  # ==============================================
  # Loki - Dev Overrides
  # ==============================================
  loki:
    ports:
      - "3100:3100"  # Loki HTTP

  # ==============================================
  # Jaeger - Enable in Dev
  # ==============================================
  jaeger:
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC
      - "6831:6831/udp" # Compact thrift
    profiles: []  # Remove profile to enable by default

  # ==============================================
  # Node Exporter - Dev Overrides
  # ==============================================
  node-exporter:
    ports:
      - "9100:9100"

  # ==============================================
  # cAdvisor - Dev Overrides
  # ==============================================
  cadvisor:
    ports:
      - "8080:8080"

  # ==============================================
  # Postgres Exporter - Dev Overrides
  # ==============================================
  postgres-exporter:
    ports:
      - "9187:9187"

  # ==============================================
  # Redis Exporter - Dev Overrides
  # ==============================================
  redis-exporter:
    ports:
      - "9121:9121"
