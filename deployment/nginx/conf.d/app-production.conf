server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Multi-tenancy with subdomains (MultiTenancy:Resolution:RootDomain=api.example.com): also serve the tenants,
    #   server_name api.example.com *.api.example.com;
    # with a wildcard certificate (ACME DNS-01) and keep `proxy_set_header Host $host;` so the API sees the subdomain.
    server_name api.example.com;

    server_tokens off;

    # Logging
    access_log /var/log/nginx/starterkit-http-access.log json_combined;
    error_log /var/log/nginx/starterkit-http-error.log warn;

    # Allow Let's Encrypt ACME challenges for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================
# HTTPS Server (Port 443) - Main Production
# ==============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api.example.com;
    server_tokens off;

    # Logging
    access_log /var/log/nginx/starterkit-https-access.log json_combined;
    error_log /var/log/nginx/starterkit-https-error.log warn;

    # ==============================================
    # SSL Configuration (Certbot)
    # ==============================================
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    
    # Include Certbot's SSL options
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP Stapling (faster SSL handshake)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.example.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ==============================================
    # HTTPS Security Headers
    # ==============================================
    # HSTS: Force HTTPS for 2 years
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # Connection limiting
    limit_conn conn_limit 20;

    # Return 429 (not default 503) when rate limit is hit
    limit_req_status 429;

    # CORS-aware error pages for nginx-generated responses.
    # These only fire when nginx responds directly (rate limit, backend down).
    # Backend errors pass through as-is with ASP.NET CORS headers.
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @backend_unavailable;

    # ==============================================
    # API Routes (Main Application)
    # ==============================================
    location / {
        # CORS preflight — respond at nginx, skip rate limit and backend round-trip.
        # Runs in rewrite phase (before preaccess), so limit_req never fires.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://starterkit_api;

        # Headers (HTTPS-aware)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # Important for HTTPS
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Request-ID $request_id;

        # Disable caching for API
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Security headers (repeated here — any add_header in a location block
        # cancels all add_header directives from parent blocks)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Cache-Status "BYPASS" always;
    }

    # ==============================================
    # Real-time Hubs (SignalR: WebSockets, SSE/long-polling fallback)
    # ==============================================
    # /hubs/notifications: in-app notifications pushed to open sessions. Long-lived sockets, so:
    #   - WebSocket upgrade headers, no proxy buffering, a read timeout well above the hub keep-alive (15s);
    #   - a per-IP CONNECTION budget instead of a request rate (a socket is one request that lasts for hours);
    #   - a log format WITHOUT the query string (the access token travels as ?access_token=).
    # Several API replicas: clients use WebSockets with skipNegotiation (or enable sticky sessions here) and the API
    # uses the Redis backplane (Realtime:UseRedisBackplane). Guide: wiki/Modules/Notification-Realtime-and-Push.md.
    location /hubs/ {
        access_log /var/log/nginx/starterkit-hubs-access.log json_hubs;

        limit_conn hub_conn 50;

        proxy_pass http://starterkit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Never replay a socket upgrade on another replica mid-handshake.
        proxy_next_upstream off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==============================================
    # Authentication Endpoints (Stricter Rate Limit)
    # ==============================================
    location ~ ^/api/(auth|login|register|token|refresh) {
        # CORS preflight — critical here because auth_limit is only 10r/s
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://starterkit_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==============================================
    # Health Check (No Rate Limit)
    # ==============================================
    location = /health {
        access_log off;

        proxy_pass http://starterkit_api/health;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /alive {
        access_log off;

        proxy_pass http://starterkit_api/alive;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ==============================================
    # Swagger UI (RESTRICTED - Dev/Testing Only)
    # ==============================================
    location /swagger {
        # PRODUCTION SECURITY: Restrict access to specific IPs
        allow 127.0.0.1;
        # allow YOUR_ADMIN_IP;   # TODO: add the public IP(s) allowed to reach this endpoint
        deny all;

        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://starterkit_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ==============================================
    # Scalar API Documentation (RESTRICTED)
    # ==============================================
    location /scalar {
        # PRODUCTION SECURITY: Restrict to specific IP
        allow 127.0.0.1;
        # allow YOUR_ADMIN_IP;   # TODO: add the public IP(s) allowed to reach this endpoint
        deny all;

        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://starterkit_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ==============================================
    # Monitoring Dashboards (IP RESTRICTED)
    # ==============================================

    # Seq Logs
    location /seq/ {
        # PRODUCTION SECURITY: Add your IP
        # allow YOUR_IP_HERE;
        # deny all;
        deny all;  # Default: blocked

        proxy_pass http://localhost:5341/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Grafana
    location /grafana/ {
        # allow YOUR_IP_HERE;
        # deny all;
        deny all;

        proxy_pass http://localhost:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Prometheus
    location /prometheus/ {
        # allow YOUR_IP_HERE;
        # deny all;
        deny all;

        proxy_pass http://localhost:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Jaeger UI
    location /jaeger/ {
        # allow YOUR_IP_HERE;
        # deny all;
        deny all;

        proxy_pass http://localhost:16686/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ==============================================
    # Nginx Status (Localhost Only)
    # ==============================================
    location /nginx_status {
        stub_status on;
        access_log off;

        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # ==============================================
    # CORS-Aware Error Responses
    # ==============================================
    # These named locations handle nginx-generated errors (rate limit,
    # backend unreachable). They add CORS headers so the browser reports
    # the real error to JS instead of a misleading "CORS blocked" message.

    location @too_many_requests {
        internal;
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Type' 'application/json' always;
        add_header 'Retry-After' 1 always;
        return 429 '{"error":"Too many requests"}';
    }

    location @backend_unavailable {
        internal;
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Type' 'application/json' always;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    # ==============================================
    # Security: Block Common Exploit Attempts
    # ==============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(env|git|svn|htaccess|htpasswd|ini|conf|bak|backup|sql|dump)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* (wp-admin|wp-login|phpmyadmin|xmlrpc) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
}
