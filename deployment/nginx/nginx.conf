# ==============================================
# StarterKit Production Nginx Main Configuration
# ==============================================
# This configuration is for HOST-INSTALLED Nginx
# NOT for Docker Nginx container
#
# Location: /etc/nginx/nginx.conf
#
# Usage:
#   sudo cp deployment/nginx/nginx.conf /etc/nginx/nginx.conf
#   sudo cp deployment/nginx/conf.d/app-production.conf /etc/nginx/sites-available/starterkit
#   sudo ln -s /etc/nginx/sites-available/starterkit /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

# Load dynamic modules
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ==============================================
    # Basic Settings
    # ==============================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 45;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;
    server_names_hash_bucket_size 64;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;

    # ==============================================
    # Logging Configuration
    # ==============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"request_length":$request_length,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ==============================================
    # Gzip Compression
    # ==============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/x-javascript;
    gzip_disable "msie6";
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    # ==============================================
    # Security Headers (Global)
    # ==============================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==============================================
    # Rate Limiting Zones
    # ==============================================
    # Production-grade rate limiting to protect against abuse
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==============================================
    # CORS Origin Map (nginx-generated responses only)
    # ==============================================
    # ASP.NET handles CORS for all proxied responses.
    # This map is ONLY used when nginx responds directly (429, 502, 504)
    # so browsers see valid CORS headers instead of a generic CORS error.
    map $http_origin $cors_origin {
        default "";
        "https://www.example.com" $http_origin;
        "https://example.com"     $http_origin;
    }

    # ==============================================
    # Upstream Backend Servers
    # ==============================================
    # Load balance between API instances running in Docker
    upstream starterkit_api {
        least_conn;  # Route to server with least connections
        
        # Primary API instance
        server localhost:5000 max_fails=3 fail_timeout=30s weight=1;
        
        # Backup server (uncomment if you have a backup instance)
        # server localhost:5002 max_fails=3 fail_timeout=30s weight=1 backup;
        
        # Keepalive connections to backend for better performance
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # ==============================================
    # Proxy Global Settings
    # ==============================================
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # Hide backend server information
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    
    # Proxy buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 16k;
    
    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Failover configuration
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # ==============================================
    # SSL Session Cache
    # ==============================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ==============================================
    # Open File Cache (Performance Optimization)
    # ==============================================
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ==============================================
    # Include Virtual Host Configurations
    # ==============================================
    # Site-specific configurations in sites-enabled
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
