# Prometheus for the observability-lite overlay (docker-compose.observability-lite.yml): no OTel collector, the API's
# own OpenTelemetry Prometheus exporter is scraped directly (/metrics, ObservabilityOptions:UsePrometheusExporter).
# dns_sd_configs resolves every container behind a compose service name, so `--scale api=N` / `--scale worker=N`
# replicas are all scraped. A service that is not running (no worker overlay) simply has no targets.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "api"
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 80

  - job_name: "worker"
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 80

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
