# ==============================================
# StarterKit Development Configuration
# ==============================================
# Simplified configuration for local development

server {
    listen 80;
    server_name localhost;

    # ==============================================
    # Development Settings
    # ==============================================
    access_log /var/log/nginx/dev-access.log main;
    error_log /var/log/nginx/dev-error.log debug;

    # Disable rate limiting in dev
    # limit_req off;

    # ==============================================
    # Real-time Hubs (SignalR) - see deployment/nginx/conf.d/app-production.conf for the reasoning
    # ==============================================
    location /hubs/ {
        # The access token travels as ?access_token= (browsers cannot set Authorization on a WebSocket): the
        # "combined" format would write it to disk, so hub requests are not access-logged here.
        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream off;

        proxy_pass http://starterkit_api;
    }

    # ==============================================
    # API Proxy
    # ==============================================
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for hot reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_pass http://starterkit_api;
        
        # Disable buffering for development
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Long timeouts for debugging
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ==============================================
    # Root redirects to Swagger
    # ==============================================
    location = / {
        return 302 /swagger;
    }

    # ==============================================
    # Swagger/OpenAPI
    # ==============================================
    location /swagger {
        proxy_pass http://starterkit_api/swagger;
        proxy_set_header Host $host;
    }
    
    location /openapi {
        proxy_pass http://starterkit_api/openapi;
        proxy_set_header Host $host;
    }

    # ==============================================
    # Health Checks
    # ==============================================
    location /health {
        access_log off;
        proxy_pass http://starterkit_api/health;
        proxy_set_header Host $host;
    }
    
    location /alive {
        access_log off;
        proxy_pass http://starterkit_api/alive;
        proxy_set_header Host $host;
    }

    # ==============================================
    # PgAdmin Proxy (Optional)
    # ==============================================
    location /pgadmin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Script-Name /pgadmin;
        
        proxy_pass http://pgadmin/;
        proxy_redirect off;
    }

    # ==============================================
    # Redis Commander Proxy (Optional)
    # ==============================================
    location /redis/ {
        proxy_pass http://redis-commander:8081/;
        proxy_set_header Host $host;
    }

    # ==============================================
    # Seq Logs Proxy (Optional)
    # ==============================================
    location /logs/ {
        proxy_pass http://seq:80/;
        proxy_set_header Host $host;
    }
}
