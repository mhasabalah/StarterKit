# ==============================================
# StarterKit API - Production Nginx Configuration
# ==============================================


# ==============================================
# HTTP Server - Redirect to HTTPS
# ==============================================
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health checks (no redirect for monitoring)
    location = /health { 
        access_log off;
        proxy_pass http://starterkit_api/health;
        proxy_set_header Host $host;
    }
    
    location = /alive { 
        access_log off;
        proxy_pass http://starterkit_api/alive;
        proxy_set_header Host $host;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================
# HTTPS Server
# ==============================================
server {
    listen 443 ssl http2;
    server_name ${NGINX_SERVER_NAME};

    # ==============================================
    # SSL/TLS Configuration
    # ==============================================
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # Let client choose with TLS 1.3
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # SSL optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 8.8.8.8 8.8.4.4 valid=30s ipv6=off;  # Docker DNS + Public DNS fallback
    resolver_timeout 5s;

    # ==============================================
    # Security Headers
    # ==============================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=()" always;
    add_header X-Request-ID $request_id always;

    # ==============================================
    # Request Limits & Timeouts
    # ==============================================
    client_max_body_size 10M;
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 45s;
    send_timeout 10s;

    # ==============================================
    # Logging
    # ==============================================
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ==============================================
    # Rate Limiting (Global)
    # ==============================================
    limit_req zone=general_limit burst=20 nodelay;
    limit_req_status 429;
    limit_conn conn_limit 10;
    
    # ==============================================
    # Proxy Error Handling
    # ==============================================
    proxy_intercept_errors on;

    # ==============================================
    # Health Check Endpoints
    # ==============================================
    location = /health {
        access_log off;
        proxy_pass http://starterkit_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    location = /alive {
        access_log off;
        proxy_pass http://starterkit_api/alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ==============================================
    # Authentication Endpoints (Strict Rate Limiting)
    # ==============================================
    location ~ ^/api/v[0-9]+/(auth|login|register|token|password|verify) {
        limit_req zone=auth_limit burst=5 nodelay;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # No caching for auth endpoints
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        proxy_pass http://starterkit_api;
    }

    # ==============================================
    # Real-time Hubs (SignalR) - see deployment/nginx/conf.d/app-production.conf for the reasoning
    # ==============================================
    location /hubs/ {
        # The access token travels as ?access_token= (browsers cannot set Authorization on a WebSocket): the
        # "combined" format would write it to disk, so hub requests are not access-logged here.
        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream off;

        proxy_pass http://starterkit_api;
    }

    # ==============================================
    # API Endpoints (Standard Rate Limiting)
    # ==============================================
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        
        # WebSocket support (uses map from line 298)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;
        
        # Proxy pass to backend
        proxy_pass http://starterkit_api;
        
        # Error handling with failover
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        
        # Disable caching for API responses
        proxy_no_cache $http_pragma $http_authorization;
        proxy_cache_bypass $http_pragma $http_authorization;
        
        # CORS headers (uncomment and configure if needed)
        # add_header Access-Control-Allow-Origin "https://yourdomain.com" always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        # add_header Access-Control-Max-Age "3600" always;
        # add_header Access-Control-Allow-Credentials "true" always;
        
        # Handle preflight requests
        # if ($request_method = 'OPTIONS') {
        #     return 204;
        # }
    }

    # ==============================================
    # Static Files (if serving frontend)
    # ==============================================
    location /static/ {
        alias /var/www/static/;
        
        # Try to serve file, return 404 if not found
        try_files $uri =404;
        
        # Caching
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Compression
        gzip_static on;
        
        # Security
        add_header X-Content-Type-Options "nosniff" always;
        
        # Disable logging for static assets
        access_log off;
        log_not_found off;
    }

    # ==============================================
    # API Documentation - DISABLED IN PRODUCTION
    # ==============================================
    location /swagger {
        # Option 1: Completely disable in production
        return 404;
        
        # Option 2: Require authentication (uncomment below)
        # auth_basic "API Documentation";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        # proxy_pass http://starterkit_api/swagger;
        # proxy_set_header Host $host;
    }

    location /docs {
        # Disable API docs in production
        return 404;
    }

    location /redoc {
        # Disable API docs in production
        return 404;
    }

    # ==============================================
    # Monitoring Endpoints (Restricted Access)
    # ==============================================
    location /metrics {
        # Restrict to internal Docker networks and specific IPs
        allow 172.16.0.0/12;   # Docker default bridge networks
        allow 10.0.0.0/8;      # Private network
        # allow 192.168.1.100;  # Add specific monitoring server IPs
        deny all;
        
        access_log off;
        
        proxy_pass http://starterkit_api/metrics;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ==============================================
    # Security: Deny Access to Hidden Files
    # ==============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ==============================================
    # Security: Deny Access to Sensitive Files
    # ==============================================
    location ~* \.(env|git|gitignore|conf|ini|log|bak|sql|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ==============================================
    # Error Pages
    # ==============================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    error_page 429 /429.html;
    
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ==============================================
# WebSocket Connection Upgrade Map
# ==============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

