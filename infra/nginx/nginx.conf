# ==============================================
# StarterKit Nginx Main Configuration
# ==============================================
# Production-grade reverse proxy with security hardening
# Optimized for high performance and reliability

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==============================================
    # Logging Configuration
    # ==============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    log_format json_logs escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"request_length":$request_length,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
    '}';

    access_log /var/log/nginx/access.log json_logs;

    # ==============================================
    # Performance Tuning
    # ==============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 45;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ==============================================
    # Gzip Compression
    # ==============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_disable "msie6";

    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    # ==============================================
    # Security Headers (Global)
    # ==============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==============================================
    # Rate Limiting Zones
    # ==============================================
    # Production-grade rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==============================================
    # Upstream Backend Servers
    # ==============================================
    upstream starterkit_api {
        least_conn;
        
        # StarterKit API (ASP.NET Core runs on port 80 in Docker)
        server api:80 max_fails=3 fail_timeout=30s;
        
        # Add more API instances for high availability
        # server api2:80 max_fails=3 fail_timeout=30s;
        # server api3:80 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ==============================================
    # Cache Configuration
    # ==============================================
    # API response cache (use sparingly, most APIs should not cache)
    proxy_cache_path /var/cache/nginx/api 
                     levels=1:2 
                     keys_zone=api_cache:10m 
                     max_size=100m 
                     inactive=1h 
                     use_temp_path=off;
    
    # Static file cache
    proxy_cache_path /var/cache/nginx/static 
                     levels=1:2 
                     keys_zone=static_cache:10m 
                     max_size=500m 
                     inactive=7d 
                     use_temp_path=off;

    # Cache key configuration
    proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # ==============================================
    # Proxy Global Settings
    # ==============================================
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # Hide backend server information
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    
    # Proxy buffering
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;
    proxy_temp_file_write_size 16k;

    # ==============================================
    # Open File Cache (Performance Optimization)
    # ==============================================
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ==============================================
    # SSL Session Cache (Defined Here)
    # ==============================================
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==============================================
    # Security Settings
    # ==============================================
    # Note: Security headers are defined in the HTTPS vhost only
    # to avoid duplication and ensure proper HSTS handling

    # ==============================================
    # Include Virtual Host Configurations
    # ==============================================
    include /etc/nginx/conf.d/*.conf;
}
