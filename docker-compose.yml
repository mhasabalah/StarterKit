# ==============================================
# StarterKit Docker Compose - Core Services
# ==============================================
# Production configuration with VPS Nginx setup
# For development, docker-compose.override.yml is automatically merged
# ==============================================

# ==============================================
# Networks
# ==============================================
networks:
  backend:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_backend
  database:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_database
    # internal: true

# ==============================================
# Volumes
# ==============================================
volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_postgres_data
  postgres-wal:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_postgres_wal
  postgres-socket:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_postgres_socket
  pgbackrest-spool:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_pgbackrest_spool
  pgbackrest-log:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_pgbackrest_log
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_redis_data
  seq-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_seq_data

# ==============================================
# Secrets (Production)
# ==============================================
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  identity_otp_hmac_key:
    file: ./secrets/identity_otp_hmac_key.txt
  # Optional privileged (DDL) connection string for the migrator only. May be an empty file (then the runtime
  # connection is used). Mounted as /run/secrets/Database__MigrationConnectionString -> Database:MigrationConnectionString.
  migration_connection_string:
    file: ./secrets/migration_connection_string.txt

# ==============================================
# Services
# ==============================================
services:

  # ==============================================
  # PostgreSQL Database
  # ==============================================
  postgres:
    # postgres:16-alpine + pgBackRest (infra/postgres): archive_command runs in this container.
    image: ${COMPOSE_PROJECT_NAME:-starterkit}-postgres:16
    build:
      context: ./infra/postgres
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-postgres
    # PID 1 must not be the postmaster: pgBackRest archive-async forks a process that is re-parented to PID 1,
    # and the postmaster treats any unknown child that exits non-zero as a crashed backend and restarts the server.
    init: true
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
      # pgBackRest repository (rendered into /etc/pgbackrest/pgbackrest.conf; empty bucket = archiving off)
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      # Loopback only: Docker's port publishing bypasses the host firewall (UFW), so 0.0.0.0 would put the
      # database on the internet. Reach it through an SSH tunnel; set BIND_ADDRESS to change it.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal_archive
      - postgres-socket:/var/run/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-1.0}'
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION:-512m}
    command:
      - "postgres"
      # Connection Settings
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"

      # Memory Settings
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"

      # WAL Settings (basic replication support)
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=3"
      - "-c"
      - "wal_keep_size=1GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "wal_buffers=16MB"

      # WAL Archiving for pgBackRest
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest-archive-wal %p"

      # Checkpoint Settings
      - "-c"
      - "checkpoint_completion_target=0.9"

      # Query Tuning
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"

      # Logging (for debugging)
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "

  # ==============================================
  # pgBackRest - PostgreSQL Backup & Restore
  # ==============================================
  pgbackrest:
    # The same image as postgres (infra/postgres): one pgBackRest version, one rendered configuration, and
    # pgBackRest runs as the postgres user that owns the data directory.
    #   backup:  docker compose exec -u postgres pgbackrest pgbackrest --stanza=starterkit --type=full backup
    #   restore: docker compose run --rm --no-deps pgbackrest pgbackrest --stanza=starterkit --delta restore
    image: ${COMPOSE_PROJECT_NAME:-starterkit}-postgres:16
    build:
      context: ./infra/postgres
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-pgbackrest
    # PID 1 must not be the postmaster: pgBackRest archive-async forks a process that is re-parented to PID 1,
    # and the postmaster treats any unknown child that exits non-zero as a crashed backend and restarts the server.
    init: true
    hostname: pgbackrest
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]
    environment:
      # pgBackRest repository (rendered into /etc/pgbackrest/pgbackrest.conf by the entrypoint)
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal_archive
      - postgres-socket:/var/run/postgresql
      - pgbackrest-spool:/var/spool/pgbackrest
      - pgbackrest-log:/var/log/pgbackrest
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '${BACKUP_CPUS:-0.5}'
          memory: ${BACKUP_MEMORY_LIMIT:-512m}
        reservations:
          memory: ${BACKUP_MEMORY_RESERVATION:-256m}

  # ==============================================
  # Redis Cache
  # ==============================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-redis
    restart: unless-stopped
    secrets:
      - redis_password
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.5}'
          memory: ${REDIS_MEMORY_LIMIT:-512m}
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-256m}
    command: >
      sh -c '
      REDIS_PASSWORD=$$(cat /run/secrets/redis_password)
      redis-server
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --appendonly yes
      --appendfsync everysec
      '

  # ==============================================
  # Seq - Structured Logging
  # ==============================================
  seq:
    image: datalust/seq:2024.3
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${SEQ_ACCEPT_EULA:-Y}
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '${SEQ_CPUS:-0.5}'
          memory: ${SEQ_MEMORY_LIMIT:-1g}
        reservations:
          memory: ${SEQ_MEMORY_RESERVATION:-512m}

  # ==============================================
  # StarterKit API
  # ==============================================
  api:
    image: ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-api
    build:
      context: .
      dockerfile: src/Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    restart: unless-stopped
    user: root  # Required to read Docker secrets from /run/secrets
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret
      - identity_otp_hmac_key
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:80"
      # Client IP: forwarded headers are trusted only from ForwardedHeaders:KnownProxies/KnownNetworks
      # (appsettings.Docker.json trusts private networks = the nginx container). Never set ASPNETCORE_FORWARDEDHEADERS_ENABLED.
      TZ: ${TZ:-UTC}

      # Database configuration (secrets handled by entrypoint)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Logs/traces to Seq over OTLP (Aspire.Seq, ConnectionStrings:seq)
      ConnectionStrings__seq: "http://seq:80"

      # JWT (Issuer/Audience only - secret handled by entrypoint)
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__AccessTokenExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-15}
      JwtSettings__RefreshTokenExpirationDays: ${JWT_REFRESH_EXPIRATION_DAYS:-7}

      # OpenTelemetry
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-starterkit-api}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}

      # Application
      AppSettings__EnableSwagger: "false"
      AppSettings__EnableDetailedErrors: "false"
      Hangfire__DashboardAuth__Username: ${HANGFIRE_DASHBOARD_USERNAME:-}
      Hangfire__DashboardAuth__Password: ${HANGFIRE_DASHBOARD_PASSWORD:-}
      # Multi-tenancy (see wiki/MultiTenancy/Overview.md). Disabled = single tenant.
      MultiTenancy__Enabled: ${MULTITENANCY_ENABLED:-false}
      MultiTenancy__DefaultIsolation: ${MULTITENANCY_DEFAULT_ISOLATION:-Shared}
      MultiTenancy__Resolution__RootDomain: ${MULTITENANCY_ROOT_DOMAIN:-}
      MultiTenancy__Database__EnableRowLevelSecurity: ${MULTITENANCY_RLS_ENABLED:-true}
      MultiTenancy__Cors__FrontendRootDomain: ${MULTITENANCY_FRONTEND_ROOT_DOMAIN:-}
      MultiTenancy__Impersonation__Enabled: ${MULTITENANCY_IMPERSONATION_ENABLED:-true}
      RateLimiting__Tenant__PermitLimit: ${RATE_LIMIT_TENANT_PERMITS:-0}
      # Messaging transport: InMemory | PostgreSql | RabbitMq (RabbitMq: add docker-compose.rabbitmq.yml)
      Messaging__Transport: ${MESSAGING_TRANSPORT:-PostgreSql}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5000}:80"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started
      # Schema is applied by the one-shot migrator BEFORE any API instance starts (appsettings.Docker.json sets
      # Database:MigrateOnStartup=false, so the API never migrates or seeds on its own in production).
      migrator:
        condition: service_completed_successfully
    # /alive = liveness (process only; the container must not flap when Redis/Postgres blip). Readiness (/health) is
    # gated by the deploy scripts. The aspnet base image has no curl and its /bin/sh is dash (no /dev/tcp), so call
    # bash explicitly and send a raw HTTP request.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /alive HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS:-2.0}'
          memory: ${API_MEMORY_LIMIT:-2g}
        reservations:
          memory: ${API_MEMORY_RESERVATION:-1g}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s

  # ==============================================
  # Migrator - one-shot deploy-time migration + seeding (same image as the API)
  # ==============================================
  # `dotnet Api.dll --migrate-only` migrates and seeds every module database (shared + dedicated tenant databases)
  # under a Postgres advisory lock, then exits 0 (non-zero on failure, which blocks `api` from starting).
  # Optional privileged connection (DDL) so the API's runtime role can be DML-only: put it in
  # secrets/migration_connection_string.txt (see wiki/Deployment/Database-Migrations.md).
  migrator:
    image: ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-migrator
    build:
      context: .
      dockerfile: src/Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    restart: "no"
    user: root  # Required to read Docker secrets from /run/secrets
    command: ["--migrate-only"]  # image ENTRYPOINT is `dotnet Api.dll`
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret
      - identity_otp_hmac_key
      - source: migration_connection_string
        target: Database__MigrationConnectionString
    environment: *api-environment
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
