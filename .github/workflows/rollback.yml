name: Rollback Production Deployment

# Rolls production back after a bad deploy. Two independent parts, chosen by the inputs:
#   - image_tag:        run a previous API image (the `master-<sha>` tags pushed by hybrid-ci-cd.yml).
#   - restore_database: restore a logical pre-deploy dump (/backup/pre_deploy_*.sql.gz, taken by the deploy job).
# A database restore replaces the whole database (drop + recreate + restore in one transaction, stopping on the first
# error), then the migrator runs so the schema matches the image that will run. Physical/point-in-time recovery is
# deployment/postgres/scripts/restore.sh (wiki/deployment/Backups.md).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'API image tag to roll back to, e.g. master-1a2b3c4 (leave empty to keep the current image)'
        required: false
        type: string
      restore_database:
        description: 'Restore the database from a pre-deploy dump'
        required: false
        type: boolean
        default: true
      backup_file:
        description: 'Dump in /backup to restore (leave empty for the latest pre_deploy_*.sql.gz)'
        required: false
        type: string
      confirmation:
        description: 'Type "ROLLBACK" to confirm'
        required: true
        type: string

env:
  # ---- Deployment settings: override with GitHub repository *variables* (Settings > Secrets and variables > Actions > Variables)
  APP_NAME: ${{ vars.APP_NAME || 'starterkit' }}                    # docker compose container prefix / pgBackRest stanza
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/starterkit' }}           # app directory on the VPS
  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.example.com' }}  # public base URL behind Nginx
  POSTGRES_USER: ${{ vars.POSTGRES_USER || 'starterkit_user' }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB || 'starterkit' }}
  BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET || 'your-backup-bucket' }}

jobs:
  rollback:
    name: Rollback Production
    runs-on: [self-hosted, deploy-only]
    environment:
      name: production

    steps:
      - name: ⚠️ Validate inputs
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          if [ "${{ inputs.confirmation }}" != "ROLLBACK" ]; then
            echo "❌ Confirmation failed. You must type 'ROLLBACK' to proceed."
            exit 1
          fi
          if [ -z "$IMAGE_TAG_INPUT" ] && [ "${{ inputs.restore_database }}" != "true" ]; then
            echo "❌ Nothing to do: set image_tag, restore_database, or both."
            exit 1
          fi
          if [ -n "$IMAGE_TAG_INPUT" ] && ! printf '%s' "$IMAGE_TAG_INPUT" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "❌ '$IMAGE_TAG_INPUT' is not a valid image tag."
            exit 1
          fi
          echo "✅ Inputs validated (image_tag='${IMAGE_TAG_INPUT:-current}', restore_database=${{ inputs.restore_database }})"

      - name: 📥 Pull the rollback image
        if: inputs.image_tag != ''
        env:
          DOCKER_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e
          cd ${{ env.DEPLOY_DIR }}
          # Fail before anything is stopped if the tag does not exist.
          docker compose -f docker-compose.yml --env-file .env.prod pull api migrator

      - name: 🔄 Restore the database
        if: inputs.restore_database
        env:
          BACKUP_FILE: ${{ inputs.backup_file }}
        run: |
          set -euo pipefail
          cd ${{ env.DEPLOY_DIR }}
          dc() { docker compose -f docker-compose.yml --env-file .env.prod "$@"; }
          psql_() { docker exec -i ${{ env.APP_NAME }}-postgres psql -v ON_ERROR_STOP=1 -U ${{ env.POSTGRES_USER }} "$@"; }

          if [ -z "$BACKUP_FILE" ]; then
            BACKUP=$(ls -t /backup/pre_deploy_*.sql.gz 2>/dev/null | head -1 || true)
          else
            BACKUP="/backup/$(basename "$BACKUP_FILE")"
          fi
          if [ -z "$BACKUP" ] || [ ! -f "$BACKUP" ]; then
            echo "❌ Backup file not found: ${BACKUP:-<none>}"
            ls -lh /backup/*.sql.gz 2>/dev/null || echo "No backups found"
            exit 1
          fi
          gzip -t "$BACKUP"
          echo "📦 Using backup: $BACKUP ($(du -h "$BACKUP" | cut -f1), $(stat -c '%y' "$BACKUP"))"

          echo "💾 Safety backup of the current database..."
          mkdir -p /backup
          SAFETY_BACKUP="/backup/rollback_safety_$(date +%Y%m%d_%H%M%S).sql.gz"
          docker exec ${{ env.APP_NAME }}-postgres pg_dump -U ${{ env.POSTGRES_USER }} ${{ env.POSTGRES_DB }} | gzip > "$SAFETY_BACKUP"
          echo "✅ Safety backup: $SAFETY_BACKUP"

          echo "🛑 Stopping every writer..."
          WRITERS=$(dc config --services | grep -xE 'api|worker' | tr '\n' ' ')
          dc stop $WRITERS

          # A plain dump restored over the live database fails on every existing object, so replace the database.
          echo "🔄 Recreating ${{ env.POSTGRES_DB }} and restoring (single transaction, stops on the first error)..."
          psql_ -d postgres -c 'DROP DATABASE IF EXISTS "${{ env.POSTGRES_DB }}" WITH (FORCE)'
          psql_ -d postgres -c 'CREATE DATABASE "${{ env.POSTGRES_DB }}" OWNER "${{ env.POSTGRES_USER }}"'
          gunzip -c "$BACKUP" | psql_ -d ${{ env.POSTGRES_DB }} --single-transaction -q > /dev/null
          echo "✅ Database restored"

      - name: 🚀 Migrate and start the application
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -e
          cd ${{ env.DEPLOY_DIR }}
          dc() { docker compose -f docker-compose.yml --env-file .env.prod "$@"; }
          # docker compose reads DOCKER_IMAGE_TAG from the shell before .env.prod.
          if [ -n "$IMAGE_TAG_INPUT" ]; then export DOCKER_IMAGE_TAG="$IMAGE_TAG_INPUT"; fi

          # The schema must match the image that runs: forward migrations of that image (a no-op when the restored
          # dump already matches it). EF migrations never move backwards.
          dc run --rm migrator
          WRITERS=$(dc config --services | grep -xE 'api|worker' | tr '\n' ' ')
          dc up -d --no-build --no-deps $WRITERS
          echo "✅ Application started (image tag: ${DOCKER_IMAGE_TAG:-from .env.prod})"

      - name: 🏥 Verify Health
        run: |
          cd ${{ env.DEPLOY_DIR }}

          echo "🏥 Running health checks..."

          MAX_WAIT=60
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Health endpoint responding"
              break
            fi
            [ $((ELAPSED % 10)) -eq 0 ] && echo "Waiting... ${ELAPSED}s"
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ Health check timeout"
            docker compose -f docker-compose.yml --env-file .env.prod logs --tail=50 api
            exit 1
          fi

          # Public health check
          if curl -sf ${{ env.PUBLIC_API_URL }}/health > /dev/null 2>&1; then
            echo "✅ Public endpoint healthy"
          else
            echo "⚠️ Public endpoint not responding yet (may need time)"
          fi

          echo ""
          echo "✅ Application is healthy after rollback"

      - name: 📊 Rollback Summary
        if: always()
        run: |
          echo "## ⚠️ Production Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Executed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag**: ${{ inputs.image_tag || 'unchanged (DOCKER_IMAGE_TAG from .env.prod)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database restored**: ${{ inputs.restore_database }} (${{ inputs.backup_file || 'latest pre-deployment backup' }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "- **Status**: ✅ Rollback Completed Successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ❌ Rollback Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Important Notes" >> $GITHUB_STEP_SUMMARY
          echo "- 💾 A database restore first writes a safety dump to /backup/rollback_safety_*.sql.gz" >> $GITHUB_STEP_SUMMARY
          echo "- 🔁 An image rollback lasts until the next deploy or 'docker compose up' (DOCKER_IMAGE_TAG in .env.prod)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Review the cause of the issue that required rollback" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Production URL**: ${{ env.PUBLIC_API_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: 🔔 Notify Team
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "⚠️ PRODUCTION ROLLBACK COMPLETED"
            echo "Rolled back by: @${{ github.actor }}"
            echo "Status: ✅ Healthy"
            echo "URL: ${{ env.PUBLIC_API_URL }}"
          else
            echo "🚨 PRODUCTION ROLLBACK FAILED"
            echo "Attempted by: @${{ github.actor }}"
            echo "Status: ❌ Manual intervention required"
          fi
          # TODO: Add Slack/Discord/Email notification integration here
