# ==============================================
# StarterKit Observability-lite Overlay (optional)
# ==============================================
# Metrics and alerts without the full Grafana stack: Prometheus scrapes the API's own /metrics endpoint (no OTel
# collector) and Grafana shows it. Logs and traces stay in Seq (base compose, ConnectionStrings:seq).
# About 0.75 GB instead of the ~5 GB of docker-compose.observability.yml. Use ONE of the two overlays, never both.
#   dev:  docker compose -f docker-compose.yml -f docker-compose.override.yml \
#           -f docker-compose.observability-lite.yml -f docker-compose.override.observability-lite.yml up -d
#   prod: docker compose -f docker-compose.yml -f docker-compose.observability-lite.yml --env-file .env.prod up -d
# With the worker overlay (docker-compose.worker.yml), also add docker-compose.observability-lite-worker.yml.
# Alerts: infra/observability/configs/alerts.yaml (outbox, consumer faults, push, real time), the same rules as the
# full stack. Docs: wiki/deployment/Observability.md ("Lite profile").
# ==============================================

volumes:
  prometheus-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_prometheus_data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_grafana_data

services:

  # No collector in this profile: switch the standard OTLP exporter off (OtlpExporterPlan.UseStandard), so the API
  # does not keep failing to export to a missing otel-collector. Seq still receives logs and traces.
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""

  migrator:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""

  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/configs/prometheus-lite.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/configs/alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
        reservations:
          memory: 256m

  grafana:
    image: grafana/grafana:12.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: info
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/configs/grafana/provisioning-lite/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          memory: 128m
