# ==============================================
# StarterKit Observability Stack
# ==============================================
# Optional observability services for monitoring, tracing, and metrics
# Deploy separately with:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# ==============================================

# ==============================================
# Networks (Reference existing networks)
# ==============================================

# ==============================================
# Volumes
# ==============================================
volumes:
  prometheus-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_prometheus_data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_grafana_data
  tempo-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_tempo_data
  loki-data:
    name: ${COMPOSE_PROJECT_NAME:-starterkit}_loki_data

# ==============================================
# Services
# ==============================================
services:

  # ==============================================
  # OpenTelemetry Collector
  # ==============================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/observability/configs/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics (collector internal)
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          memory: 512m

  # ==============================================
  # Prometheus - Metrics Storage
  # ==============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      - '--enable-feature=native-histograms'
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/configs/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/configs/alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          memory: 512m

  # ==============================================
  # Grafana - Visualization Dashboard
  # ==============================================
  grafana:
    image: grafana/grafana:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceQLStreaming
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: info
      TZ: ${TZ:-UTC}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      - prometheus
      - tempo
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
        reservations:
          memory: 256m

  # ==============================================
  # Tempo - Distributed Tracing
  # ==============================================
  tempo:
    image: grafana/tempo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/configs/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "9095:9095"   # Tempo gRPC
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          memory: 512m

  # ==============================================
  # Loki - Log Aggregation
  # ==============================================
  loki:
    image: grafana/loki:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-loki
    restart: unless-stopped
    user: "0:0"  # Run as root to avoid permission issues
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/observability/configs/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"   # Loki HTTP
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          memory: 512m

  # ==============================================
  # Node Exporter - System Metrics
  # ==============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128m

  # ==============================================
  # cAdvisor - Container Metrics
  # ==============================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  # ==============================================
  # Postgres Exporter
  # ==============================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128m

  # ==============================================
  # Redis Exporter
  # ==============================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128m

  # ==============================================
  # Jaeger - Tracing UI (Optional)
  # ==============================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
    ports:
      - "16686:16686"  # Jaeger UI
      - "6831:6831/udp" # Compact thrift
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    profiles:
      - jaeger  # Enable with --profile jaeger
