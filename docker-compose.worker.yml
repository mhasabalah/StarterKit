# ==============================================
# StarterKit Worker Overlay (optional): run heavy background work on its own replica
# ==============================================
# Same image as the API, different Hangfire role (Hangfire:Servers:<Name>:Enabled, see
# src/Api/Infrastructure/HangfireConfiguration.cs). Here the `worker` runs ONLY the data-transfer server (bulk
# CSV/Excel import/export, DataTransfer module) and the `api` stops processing that queue, so a 200k-row import never
# competes with HTTP traffic for CPU and memory. Every instance can still enqueue jobs and serve the dashboard.
# Agent runs (queue `agentic`, Agentic module) stay on the `api`; to move them too, set
# Hangfire__Servers__Agentic__Enabled to "false" on `api` and "true" on `worker`.
#   dev:  docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.worker.yml up -d
#   prod: docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d
# Scale out: `docker compose ... up -d --scale worker=2` (jobs are leased in the database, so replicas never run the
# same job at once). Move other workloads the same way (e.g. Hangfire__Servers__Notification__Enabled).
# Docs: wiki/Modules/DataTransfer.md ("Running the workers").
# Needs Docker Compose 2.24+ (`!reset`).
# ==============================================

services:

  api:
    environment:
      Hangfire__Servers__DataTransfer__Enabled: "false"

  worker:
    extends:
      file: docker-compose.yml
      service: api
    container_name: ${COMPOSE_PROJECT_NAME:-starterkit}-worker
    environment:
      Hangfire__Servers__Default__Enabled: "false"
      Hangfire__Servers__Notification__Enabled: "false"
      Hangfire__Servers__Agentic__Enabled: "false"
      Hangfire__Servers__DataTransfer__Enabled: "true"
      Hangfire__Servers__DataTransfer__WorkerCount: ${DATATRANSFER_WORKERS:-2}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-starterkit-api}-worker
    # Not behind nginx and not published: it serves /alive for its healthcheck only.
    ports: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS:-2.0}'
          memory: ${WORKER_MEMORY_LIMIT:-2g}
